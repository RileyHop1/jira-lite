# Nginx site for Jira Lite. deploy.sh installs it as
# /etc/nginx/sites-available/jira-lite and enables it.
#
# Nginx is the only thing listening on the public port. It serves the static
# board page itself and forwards API and health requests to Gunicorn, which
# listens on 127.0.0.1 only (ADR-001, ADR-002).

server {
    # Port 80 only: HTTPS is a stretch goal (ADR-011). default_server makes this
    # site answer for any Host header, including a bare IP address.
    listen 80 default_server;
    server_name _;

    # Valid tasks are far smaller than Nginx's 1 MB default. Anything larger is
    # rejected with a 413 before it reaches Flask.
    client_max_body_size 64k;

    # Serve only the frontend folder, so nothing else in the checkout (such as
    # .git or the Python code) can be reached from the web.
    root /opt/jira-lite/app/frontend;
    index index.html;

    # Static board page. no-cache makes browsers re-check after a deploy
    # instead of showing a stale board.js.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # JSON API: hand the request to Gunicorn. proxy_params ships with Ubuntu's
    # Nginx and passes along the original Host header and client address.
    location /api/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    # Health check: same Gunicorn upstream, exact match so no other path can
    # reach it by accident.
    location = /health {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }
}
